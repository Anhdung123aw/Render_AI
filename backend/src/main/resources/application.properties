spring.application.name=architecture-ai-backend

# Oracle
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=RENDER_AI
spring.datasource.password=RenderAi_2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI API - Text (prompt building & enhancement)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
